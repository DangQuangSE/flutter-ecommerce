name: flutter_ecommerce
description: "Flutter e-commerce MVP."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.0.0
  google_fonts: ^6.1.0

  # State management
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.0

  # Navigation
  go_router: ^14.0.0
  app_links: ^6.3.2
  flutter_inappwebview: ^6.1.5

  # Maps & location (key-free: flutter_map + OpenStreetMap tiles)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

  # Networking
  dio: ^5.0.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.0
  pinput: ^5.0.0

  # Real-time chat (STOMP over WebSocket)
  stomp_dart_client: ^2.0.0

  # Dependency injection
  get_it: ^8.0.0

  # Storage
  shared_preferences: ^2.0.0

  # Utilities
  intl: ^0.19.0

  # Code generation runtime annotations
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  flutter_colorpicker: ^1.1.0
  image_picker: ^1.2.2
  http_parser: ^4.0.0
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Lets widget tests fake url_launcher's platform channel (swap
  # UrlLauncherPlatform.instance) instead of hitting the real platform.
  url_launcher_platform_interface: ^2.3.2

  # Code generation
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
